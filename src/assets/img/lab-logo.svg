<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="OKstyle LAB">
  <!-- LAB ロゴ（原案）: OKstyle の人型ピクトを発光ライン化し、軌道と粒子を重ねた派生デザイン -->
  <defs>
    <radialGradient id="lab-bg" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#14264d"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <filter id="lab-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lab-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#3be8ff" stroke-opacity=".12" stroke-width=".4"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="17" fill="url(#lab-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="17" fill="url(#lab-grid)"/>
  <rect x="2.6" y="2.6" width="94.8" height="94.8" rx="16.5" fill="none" stroke="#3be8ff" stroke-opacity=".45" stroke-width=".8"/>
  <g fill="none" stroke="#3be8ff" stroke-width=".7" stroke-opacity=".55">
    <ellipse cx="50" cy="52" rx="45" ry="13" transform="rotate(-18 50 52)"/>
    <ellipse cx="50" cy="52" rx="42" ry="10" transform="rotate(28 50 52)" stroke-dasharray="2 2.5"/>
  </g>
  <g filter="url(#lab-glow)" stroke="#3be8ff" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="38" cy="23.5" r="13.6" fill="none" stroke-width="1.6"/>
    <circle cx="39" cy="25" r="8.2" fill="#c9f8ff" stroke-width="1.2"/>
    <path d="M30 37 L50 33.5 L86.5 17.2 Q89.6 16.4 88.6 19.6 L83 24.6 L53 42.5 L50.5 57.5 L77 83.5 L54 84.5 L44 68.5 L37.5 80.5 L14.5 80.5 L30.5 60.5 L27.5 59 Q22.6 58.6 22.8 54 L23 43 Q23.4 37.8 30 37 Z" fill="#3be8ff" fill-opacity=".14" stroke-width="1.8"/>
  </g>
  <g fill="#e9fdff">
    <circle cx="8.5" cy="66" r="1.6"/>
    <circle cx="91" cy="37.5" r="1.3"/>
    <circle cx="70" cy="88" r="1"/>
    <circle cx="16" cy="18" r=".8"/>
    <circle cx="84" cy="70" r=".7"/>
  </g>
  <circle cx="52" cy="37" r="1.4" fill="#fff" filter="url(#lab-glow)"/>
</svg>
